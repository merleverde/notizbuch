plugins {
    id 'com.android.application'
}

android {
    namespace = 'de.notizbuch.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'de.notizbuch.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 57
        versionName = '6.6'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Eigener SignaturschlÃ¼ssel fÃ¼r die Tablet-Version. SchlÃ¼ssel und Passwort liegen nur auf diesem PC
    // (android/keystore.properties ist nicht im Repository). Ohne denselben SchlÃ¼ssel lassen sich
    // spÃ¤tere Updates nicht Ã¼ber die installierte App installieren.
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties()
        ksFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile = file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}

// Die Oberfläche der App (HTML/JS/CSS) liegt in app/src/main/assets/www.

// Neue Version verÃ¶ffentlichen:  .\gradlew.bat publishApk
// Baut die signierte APK und legt sie mit version.json in ../docs/download/ (öffentlicher Download-Bereich).
// Nach Commit + Push findet â€žNach Updates suchenâ€œ in der App die neue Version.
tasks.register('publishApk') {
    dependsOn 'assembleRelease'
    doLast {
        def dl = rootProject.file('../docs/download')
        dl.mkdirs()
        def apk = file('build/outputs/apk/release/app-release.apk')
        if (!apk.exists()) throw new GradleException('Keine Release-APK gefunden: ' + apk)
        java.nio.file.Files.copy(apk.toPath(), new File(dl, 'Notizbuch.apk').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def info = [versionCode: android.defaultConfig.versionCode, versionName: android.defaultConfig.versionName,
                    apk: 'Notizbuch.apk', date: new Date().format('yyyy-MM-dd')]
        new File(dl, 'version.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(info)), 'UTF-8')
        println "VerÃ¶ffentlicht: Version ${info.versionName} (${info.versionCode}) in ${dl}"
    }
}
